name: ci

on:
  push:
    branches: ['**'] # every branch, no tags: a tag push runs release.yml alone
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git rev-list --count HEAD drives versionCode; a shallow clone gives 1.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@v6

      - run: make check

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report-debug
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
