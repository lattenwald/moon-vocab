name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # creating the Release for the tag needs it; nothing else here does

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git rev-list --count HEAD drives versionCode; a shallow clone gives 1.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@v6

      # The secret is `base64 -w0 ~/.android/debug.keystore`, the file the Makefile signs with.
      - name: Restore the signing keystore from the secret
        env:
          KEYSTORE_BASE64: ${{ secrets.MOON_VOCAB_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo '::error::secret MOON_VOCAB_KEYSTORE is not set' >&2
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: make release

      - name: Attach the APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/moon-vocab-*.apk
          fail_on_unmatched_files: true

      - name: Upload the APK as a workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: moon-vocab-release-apk
          path: app/build/outputs/apk/release/moon-vocab-*.apk
          if-no-files-found: error
